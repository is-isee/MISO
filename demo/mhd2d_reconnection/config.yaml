io:
  save_dir: data/
  continue: false

time:
  tend: 250.0
  dt_output: 10.0

# The paper uses [0, 200] x [0, 150] with 12000 x 9000 cells.
grid:
  i_size: 1500
  j_size: 1
  k_size: 300
  margin: 2
  x_min: 0.0
  x_max: 150.0
  y_min: 0.0
  y_max: 1.0
  z_min: 0.0
  z_max: 30.0

mpi:
  x_procs: 2
  y_procs: 1
  z_procs: 1

domain:
  periodic:
    x: false
    y: false
    z: false

mhd:
  cfl_number: 0.5

eos:
  gm: 1.6666666666666667

# Zenitani (2015): run 1 (beta_up = 0.1), run 2 (beta_up = 0.2)
reconnection:
  beta_up: 0.2
  eta0: 0.001
  eta1: 0.016666666666666666
  a_pert: 0.06
